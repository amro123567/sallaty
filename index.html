<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sallaty – Online Shop | Free Delivery All Over Lebanon</title>
  <meta name="description" content="Sallaty online shop: Christmas gifts, decor, fashion and beauty with FREE delivery all over Lebanon. Order in seconds on WhatsApp, pay cash on delivery.">
  <meta name="theme-color" content="#0B1A33">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sallaty – Online Shop">
  <meta property="og:description" content="Thoughtful gifts & everyday essentials. FREE delivery all over Lebanon. Order on WhatsApp.">
  <meta property="og:image" content="assets/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body data-page="home">
  <div id="app-header"></div>

  <main id="main">
    <!-- HERO -->
    <section class="hero" aria-labelledby="hero-title">
      <canvas id="snow" class="snow" aria-hidden="true"></canvas>
      <div class="container hero-inner">
        <div class="hero-copy">
          <p class="micro hero-eyebrow" data-i18n="heroEyebrow"></p>
          <h1 class="hero-title display" id="hero-title" data-i18n="heroTitle"></h1>
          <p class="hero-sub" data-i18n="heroSub"></p>
          <div class="hero-ctas">
            <a class="btn btn-primary btn-lg" href="#offers"><span data-i18n="shopOffers"></span></a>
            <a class="btn btn-ghost-light btn-lg" id="hero-wa" href="#" target="_blank" rel="noopener">
              <svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 3C8.8 3 3 8.7 3 15.8c0 2.5.7 4.9 2 7L3 29l6.4-2c2 1.1 4.3 1.7 6.6 1.7 7.2 0 13-5.7 13-12.8S23.2 3 16 3zm6 15.5c-.3-.2-1.9-1-2.2-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-1.9-1.8-2.2-.2-.3 0-.5.1-.7l.5-.6.3-.5c.1-.2 0-.4 0-.5l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5.1 4.5 2.5 1 3 .8 3.6.8.5-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4z"/></svg>
              <span data-i18n="orderOnWa"></span>
            </a>
          </div>
          <div class="hero-countdown xmas-only" aria-label="Countdown to Christmas">
            <span class="micro" data-i18n="countdownLabel"></span>
            <div class="countdown" data-countdown="">
              <div><b data-u="d">00</b><small data-i18n="days"></small></div>
              <div><b data-u="h">00</b><small data-i18n="hours"></small></div>
              <div><b data-u="m">00</b><small data-i18n="mins"></small></div>
              <div><b data-u="s">00</b><small data-i18n="secs"></small></div>
            </div>
          </div>
        </div>

        <div class="hero-visual" id="hero-visual">
          <div class="hero-brand">
            <img src="assets/logo-white.png" alt="" width="260" height="77">
          </div>
        </div>
      </div>
      <button class="snow-toggle" id="snow-toggle" type="button" aria-pressed="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 2v20M4.9 4.9l14.2 14.2M2 12h20M4.9 19.1 19.1 4.9"/></svg>
        <span></span>
      </button>
    </section>

    <!-- TRUST -->
    <section class="trust" aria-labelledby="trust-title">
      <h2 class="sr-only" id="trust-title" data-i18n="trustTitle"></h2>
      <div class="container trust-grid">
        <div class="trust-item">
          <svg class="trust-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5h11v9h-11zM13.5 9.5h4l3 3v3h-7"/><circle cx="6.5" cy="17.5" r="1.7"/><circle cx="17" cy="17.5" r="1.7"/></svg>
          <div><b data-i18n="trust1"></b><span data-i18n="trust1s"></span></div>
        </div>
        <div class="trust-item">
          <svg class="trust-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="1.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/></svg>
          <div><b data-i18n="trust2"></b><span data-i18n="trust2s"></span></div>
        </div>
        <div class="trust-item">
          <svg class="trust-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 0 1-12.4 7.5L3.5 20.5l1-4.4A8.5 8.5 0 1 1 20.5 12z"/><path d="M8.5 11h7M8.5 14h4.5"/></svg>
          <div><b data-i18n="trust3"></b><span data-i18n="trust3s"></span></div>
        </div>
        <div class="trust-item">
          <svg class="trust-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 0 1 14.6-5.9L20.5 8.5"/><path d="M20.5 3.5v5h-5"/><path d="M20.5 12a8.5 8.5 0 0 1-14.6 5.9L3.5 15.5"/><path d="M3.5 20.5v-5h5"/></svg>
          <div><b data-i18n="trust4"></b><span data-i18n="trust4s"></span></div>
        </div>
      </div>
    </section>

    <!-- CATEGORY TILES -->
    <section class="section categories reveal" id="categories" aria-labelledby="cats-title" hidden>
      <div class="container">
        <header class="section-head">
          <div>
            <p class="micro" data-i18n="catsEyebrow"></p>
            <h2 class="section-title display" id="cats-title" data-i18n="catsTileTitle"></h2>
          </div>
        </header>
        <div class="cat-tiles" id="category-tiles"></div>
      </div>
    </section>

    <!-- OFFERS -->
    <section class="section offers reveal" id="offers" aria-labelledby="offers-title">
      <div class="container">
        <header class="section-head">
          <div>
            <p class="micro micro-accent" data-i18n="offersEyebrow"></p>
            <h2 class="section-title display" id="offers-title"><span data-i18n="offersTitle"></span> <span class="offers-max" id="offers-max"></span></h2>
            <p class="section-sub" data-i18n="offersSub"></p>
          </div>
          <div class="carousel-nav">
            <button class="car-btn car-prev" type="button" data-i18n-aria="prev">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <button class="car-btn car-next" type="button" data-i18n-aria="next">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
        </header>
        <div class="carousel" id="offers-carousel">
          <div class="carousel-track" id="offers-track" tabindex="0" data-i18n-aria="offersTitle"></div>
        </div>
        <div class="promo-grid" id="promo-banners"></div>
      </div>
    </section>

    <!-- SHOP -->
    <section class="section shop reveal" id="shop" aria-labelledby="shop-title">
      <div class="container">
        <header class="section-head">
          <div>
            <p class="micro" data-i18n="shopEyebrow"></p>
            <h2 class="section-title display" id="shop-title"><span data-i18n="shopTitle"></span> <small id="shop-count"></small></h2>
          </div>
        </header>
        <div class="shop-bar">
          <div class="cat-list" id="category-list" role="group" data-i18n-aria="catsTitle"></div>
          <div class="toolbar">
            <label class="tool-search">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <span class="sr-only" data-i18n="search"></span>
              <input type="search" id="shop-q" data-i18n-ph="filterSearchPh" autocomplete="off">
            </label>
            <label class="tool-sort">
              <span class="sr-only" data-i18n="sortBy"></span>
              <select id="shop-sort">
                <option value="featured" data-i18n="sortFeatured"></option>
                <option value="price-asc" data-i18n="sortPriceAsc"></option>
                <option value="price-desc" data-i18n="sortPriceDesc"></option>
                <option value="discount" data-i18n="sortDiscount"></option>
                <option value="newest" data-i18n="sortNewest"></option>
              </select>
            </label>
          </div>
        </div>

        <div class="grid" id="product-grid" aria-live="polite"></div>
        <div class="empty" id="shop-empty" hidden>
          <h3 data-i18n="noResults"></h3>
          <p data-i18n="noResultsSub"></p>
          <button class="btn btn-outline" type="button" id="clear-filters" data-i18n="clearFilters"></button>
        </div>
      </div>
    </section>

    <!-- REVIEWS (shown only when js/reviews.js has real reviews) -->
    <section class="section reviews reveal" id="reviews" aria-labelledby="reviews-title" hidden>
      <div class="container">
        <header class="section-head">
          <div>
            <p class="micro" data-i18n="reviewsEyebrow"></p>
            <h2 class="section-title display" id="reviews-title" data-i18n="reviewsTitle"></h2>
            <p class="section-sub" data-i18n="reviewsSub"></p>
          </div>
          <div id="reviews-summary"></div>
        </header>
        <div class="review-grid" id="reviews-grid"></div>
      </div>
    </section>

    <!-- GIFTS -->
    <section class="section gifts reveal" id="gifts" aria-labelledby="gifts-title">
      <div class="container">
        <header class="section-head">
          <div>
            <p class="micro" data-i18n="giftsEyebrow"></p>
            <h2 class="section-title display" id="gifts-title" data-i18n="giftsTitle"></h2>
            <p class="section-sub" data-i18n="giftsSub"></p>
          </div>
        </header>
        <div class="grid" id="gift-grid"></div>
      </div>
    </section>

    <!-- FAQ -->
    <section class="section faq reveal" id="faq" aria-labelledby="faq-title">
      <div class="container faq-layout">
        <header>
          <p class="micro" data-i18n="faqEyebrow"></p>
          <h2 class="section-title display" id="faq-title" data-i18n="faqTitle"></h2>
        </header>
        <div class="accordion">
          <details><summary data-i18n="faqQ1"></summary><p id="faq-delivery-time"></p></details>
          <details><summary data-i18n="faqQ2"></summary><p data-i18n="faqA2"></p></details>
          <details><summary data-i18n="faqQ3"></summary><p data-i18n="faqA3"></p></details>
          <details><summary data-i18n="faqQ4"></summary><p id="faq-returns"></p></details>
          <details><summary data-i18n="faqQ5"></summary><p data-i18n="faqA5"></p></details>
        </div>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>

  <script src="js/config.js?v=5"></script>
  <script src="js/i18n.js?v=5"></script>
  <script src="js/products.js?v=5"></script>
  <script src="js/reviews.js?v=5"></script>
  <script src="js/sheet.js?v=5"></script>
  <script src="js/cart.js?v=5"></script>
  <script src="js/main.js?v=5"></script>
</body>
</html>
